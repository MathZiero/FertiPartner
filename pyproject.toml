[project]
name = "fertipartner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.40.0",
    "supabase>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: marks integration tests against live databases or external APIs",
]

[tool.pyright]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
